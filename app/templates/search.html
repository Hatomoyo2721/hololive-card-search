<!DOCTYPE html>
<html lang="en" class="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hololive TCG Card Search</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="/static/card-decor/holocard.css" />
  <link rel="stylesheet" href="/static/card-decor/theme.css" />
</head>

<body>

  <header class="top-bar">
    <h1>Hololive Card Search</h1>

    <button id="theme-toggle" class="theme-btn" aria-label="Toggle Theme">
      <i class="fa-solid fa-sun"></i>
      <i class="fa-solid fa-moon"></i>
    </button>

  </header>

  <div class="layout">
    <main class="content">
      <div class="search-controls">
        <div class="search-box">
          <input type="text" id="search" placeholder="Search card name or ID..." autocomplete="off" />

          <button id="search-btn" aria-label="Search cards">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>

        <select id="booster-filter" aria-label="Filter by booster pack">
          <option value="">All Booster Packs</option>
          <option value="hBP01">hBP01 - Blooming Radiance</option>
          <option value="hBP02">hBP02 - Quintet Spectrum</option>
          <option value="hBP03">hBP03 - Elite Spark</option>
          <option value="hBP04">hBP04 - Curious Universe</option>
          <option value="hBP05">hBP05 - Enchant Regalia</option>
          <option value="hBP06">hBP06 - Ayakashi Vermillion</option>
          <option value="hBP07">hBP07 - Diva Fever</option>
          <option value="hBP08">hBP08 - Bouncer Bound</option>
        </select>
      </div>

      <div id="card-container">
      </div>
    </main>
  </div>

  <script type="module" src="/static/module/cardSearch.js"></script>

</body>

</html>
