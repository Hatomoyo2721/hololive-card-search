<!DOCTYPE html>
<html lang="en" class="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hololive TCG Card Search</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="/static/card-decor/holocard.css" />
  <link rel="stylesheet" href="/static/card-decor/theme.css" />
</head>

<body>

  <header class="top-bar">
    <h1>Hololive Card Search</h1>

    <button id="theme-toggle" class="theme-btn" aria-label="Toggle Theme">
      <i class="fa-solid fa-sun"></i>
      <i class="fa-solid fa-moon"></i>
    </button>
  </header>

  <div class="layout">
    <main class="content">

      <div class="search-controls">

        <div class="search-box">

          <div class="search-input-wrapper">
            <i class="fa-solid fa-magnifying-glass search-input-icon"></i>

            <input type="text" id="search" placeholder="Search card name or card ID..." autocomplete="off" />
          </div>

          <button id="search-btn" aria-label="Search cards">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Search</span>
          </button>

          <div class="search-help" tabindex="0">

            <button type="button" class="info-btn" aria-label="Search guide" aria-expanded="false">
              <i class="fa-solid fa-circle-info"></i>
            </button>

            <div class="search-tooltip" role="dialog" aria-label="Search guide">
              <div class="tooltip-header">
                <i class="fa-solid fa-circle-info"></i>
                <span>Search Guide</span>
              </div>

              <div class="tooltip-section">
                <h3>How to search</h3>

                <div class="guide-row">
                  <span class="guide-label">By talent name</span>
                  <div class="example-list">
                    <code>Suisei</code>
                    <code>ほしまちすいせい</code>
                  </div>
                </div>

                <div class="guide-row">
                  <span class="guide-label">By card ID</span>
                  <div class="example-list">
                    <code>hBP04-066</code>
                    <code>hBP01-0</code>
                  </div>
                </div>

                <p class="guide-note">
                  Matches English, Romaji and Japanese names, and any part of a card ID.
                </p>
              </div>

              <div class="tooltip-section">
                <h3>Refine with filters</h3>

                <div class="guide-row">
                  <span class="guide-label">
                    <i class="fa-solid fa-layer-group"></i>
                    Booster pack
                  </span>
                  <p class="guide-text">
                    Each pack also lists its reprints, Start Deck and Cheer cards.
                  </p>
                </div>
              </div>

            </div>
          </div>

        </div>

        <div class="filter-row">

          <label class="filter-field">
            <span class="filter-label">
              <i class="fa-solid fa-layer-group"></i>
              Booster
            </span>
            <select id="booster-filter" aria-label="Filter by booster pack">
              <option value="">All Booster Packs</option>
              <option value="hBP01">hBP01 - Blooming Radiance</option>
              <option value="hBP02">hBP02 - Quintet Spectrum</option>
              <option value="hBP03">hBP03 - Elite Spark</option>
              <option value="hBP04">hBP04 - Curious Universe</option>
              <option value="hBP05">hBP05 - Enchant Regalia</option>
              <option value="hBP06">hBP06 - Ayakashi Vermillion</option>
              <option value="hBP07">hBP07 - Diva Fever</option>
              <option value="hBP08">hBP08 - Bouncer Bound</option>
              <option value="hBP09">hBP09 - Volume Vortex</option>
            </select>
          </label>

          <label class="filter-field">
            <span class="filter-label">
              <i class="fa-solid fa-star"></i>
              Rarity
            </span>
            <select id="rarity-filter" aria-label="Filter by rarity">
              <option value="">All Rarities</option>
              <optgroup label="Basic">
                {% for code, name in basic_rarities %}
                <option value="{{ code }}">{{ code }} - {{ name }}</option>
                {% endfor %}
              </optgroup>
              <optgroup label="Parallel / Secret">
                {% for code, name in parallel_rarities %}
                <option value="{{ code }}">{{ code }} - {{ name }}</option>
                {% endfor %}
              </optgroup>
            </select>
          </label>

        </div>

        <div class="filter-status" id="filter-status" hidden>
          <span id="filter-status-text"></span>
          <button type="button" id="filter-clear">
            <i class="fa-solid fa-xmark"></i>
            <span>Clear</span>
          </button>
        </div>

      </div>

      <div id="card-container"></div>

    </main>
  </div>

  <script type="module" src="/static/module/cardSearch.js"></script>

</body>

</html>
